name: api-deploy
on:
  push:
    branches: [main]
    paths: ["services/api/**", ".github/workflows/api-deploy.yml"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wotrep/api typecheck && pnpm --filter @wotrep/api test
      - name: Deploy (skipped until the owner adds Cloudflare secrets)
        working-directory: services/api
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set - skipping deploy. See services/api/README.md"; exit 0
          fi
          if grep -q '00000000-0000-0000-0000-000000000000' wrangler.toml; then
            echo "::notice::wrangler.toml still has the placeholder D1 database_id - skipping deploy."; exit 0
          fi
          npx --yes wrangler@3 d1 migrations apply wotrep --remote
          npx --yes wrangler@3 deploy

name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm lint
      - run: pnpm -r test
      - run: pnpm -r build
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Probe golden check (oracle must match fixtures/expected)
        run: |
          pip install cryptography
          for f in fixtures/replays/*; do
            n=$(basename "${f%.*}")
            python3 -I tools/probe/wotrep_probe.py "$f" /tmp/probe-$n
            diff <(python3 -c "import json,sys;print(json.dumps(json.load(open(sys.argv[1])),indent=1,sort_keys=True))" /tmp/probe-$n/expected.json) \
                 <(python3 -c "import json,sys;print(json.dumps(json.load(open(sys.argv[1])),indent=1,sort_keys=True))" fixtures/expected/$n.expected.json)
          done
